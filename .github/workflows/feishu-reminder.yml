name: Feishu Gold Price Broadcast

on:
  schedule:
    - cron: '17 * * * *' # 北京时间每小时第 17 分钟
  workflow_dispatch:
    inputs:
      slot:
        description: '选择播报类型，test 发送测试卡片，hourly 立即播报'
        type: choice
        required: true
        default: test
        options:
          - test
          - hourly

permissions:
  actions: read
  contents: read

concurrency:
  group: feishu-gold-${{ github.ref }}-${{ inputs.slot == 'test' && 'test' || 'observation' }}
  queue: max

jobs:
  remind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOLD_QUOTE_ARTIFACT: feishu-gold-xau-quote
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous gold quote
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GOLD_QUOTE_DIR="$RUNNER_TEMP/feishu-gold"
          printf 'GOLD_QUOTE_DIR=%s\n' "$GOLD_QUOTE_DIR" >> "$GITHUB_ENV"
          previous_run_id=$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$GOLD_QUOTE_ARTIFACT&per_page=100" |
              jq -r --arg branch "$GITHUB_REF_NAME" '
                [.[].artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch)]
                | max_by([.created_at, .id]) | .workflow_run.id // empty
              '
          )
          if [[ -n "$previous_run_id" ]]; then
            gh run download "$previous_run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$GOLD_QUOTE_ARTIFACT" --dir "$GOLD_QUOTE_DIR/previous"
          fi

      - name: Send Feishu gold price broadcast
        id: send
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
          REMINDER_SLOT: ${{ inputs.slot || 'hourly' }}
        run: |
          python feishu_reminder.py --slot "$REMINDER_SLOT" \
            --previous-quote "$GOLD_QUOTE_DIR/previous/quote.json" \
            --save-quote "$GOLD_QUOTE_DIR/current/quote.json"

      - name: Archive new gold quote
        if: ${{ !cancelled() && (steps.send.outcome == 'success' || steps.send.outcome == 'failure') && inputs.slot != 'test' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GOLD_QUOTE_ARTIFACT }}
          path: ${{ env.GOLD_QUOTE_DIR }}/current/quote.json
          if-no-files-found: ignore
          overwrite: true
