name: GitHub Trending Archive

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  archive:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: trending-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test checked-out archive code
        run: python -m unittest discover -s tests -t . -v

      - name: Scrape trending boards
        id: scrape
        env:
          TRENDING_LANGUAGES: ${{ vars.TRENDING_LANGUAGES }}
        run: python scraper.py

      - name: Commit and push data
        env:
          SNAPSHOT_DATE: ${{ steps.scrape.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "$SNAPSHOT_DATE trending JSON archive (validation passed)"
            git push
          fi

      - name: Send Feishu notification
        env:
          SNAPSHOT_DATE: ${{ steps.scrape.outputs.date }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
        run: python scraper.py --notify-only --date "$SNAPSHOT_DATE"
